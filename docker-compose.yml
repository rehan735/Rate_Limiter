services:
  # ============================================================
  # Infrastructure
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: rl_postgres
    environment:
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratelimiter -d ratelimiter"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: rl_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ============================================================
  # Gateway (Go application)
  # ============================================================
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rl_gateway
    environment:
      APP_ENV: development
      LOG_LEVEL: debug
      LOG_FORMAT: json
      GATEWAY_HTTP_PORT: "8080"
      GATEWAY_METRICS_PORT: "9090"
      CONTROL_PLANE_PORT: "8081"
      CONTROL_PLANE_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ratelimiter
      POSTGRES_USER: ratelimiter
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_SSLMODE: disable
      REDIS_ADDR: "redis:6379"
      REDIS_FAILURE_POLICY: fail_open
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      JWT_ALLOW_EPHEMERAL: "true"
      GATEWAY_ALLOW_PRIVATE_BACKENDS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://jaeger:4317"
      OTEL_SERVICE_NAME: api-gateway
      OTEL_SERVICE_VERSION: "0.1.0"
    ports:
      - "8080:8080"   # Gateway data plane
      - "8081:8081"   # Control plane API
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ============================================================
  # Frontend
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rl_frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway
    restart: unless-stopped

  # ============================================================
  # Observability
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rl_prometheus
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    container_name: rl_grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: rl_jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
    restart: unless-stopped

  # ============================================================
  # Mock Backend Services
  # ============================================================
  mock-user-service:
    build:
      context: ./services/mock-user-service
    container_name: rl_mock_users
    ports:
      - "9001:9001"
    restart: unless-stopped

  mock-order-service:
    build:
      context: ./services/mock-order-service
    container_name: rl_mock_orders
    ports:
      - "9002:9002"
    restart: unless-stopped

  mock-payment-service:
    build:
      context: ./services/mock-payment-service
    container_name: rl_mock_payments
    ports:
      - "9003:9003"
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: ratelimiter_net
